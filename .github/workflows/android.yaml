name: Android Builds

on:
  push:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache

jobs:
  build:
    name: Android Build
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r25c

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      # - name: Restore existing build cache for faster compilation
      #   uses: actions/cache@v6
      #   with:
      #     # not caching the bin folder to prevent asset duplication and stuff like that
      #     key: cache-build-android
      #     path: |
      #       .haxelib/
      #       export/release/android/obj/

      - name: Installing/Updating libraries
        run: |
          haxelib --global update haxelib
          haxe -cp commandline -D analyzer-optimize --run Main setup -si --no-vscheck

      - name: Building the game
        run: |
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
          haxelib run lime build android -final -D ONLY_ARM64 -D COMPILE_EXPERIMENTAL

      - name: Uploading artifact (APK)
        uses: actions/upload-artifact@v7
        with:
          name: Codename Engine Android (APK)
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk

      - name: Uploading artifact (entire build)
        uses: actions/upload-artifact@v7
        with:
          name: Codename Engine Android
          path: export/release/android/bin
